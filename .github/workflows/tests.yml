# Runs every test suite (new_annotator/test_*.py) on Windows and Linux.
# Locally the same: cd new_annotator && .venv\Scripts\python run_tests.py
name: Tests

on:
  push:
    branches: [main]
    paths:
      - "new_annotator/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "new_annotator/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:          # "Run workflow" button on the Actions tab

# a newer push to the same branch cancels the run still in progress
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false        # one failing OS must not hide the other's result
      matrix:
        # Ubuntu pinned: the apt package list below depends on the release
        os: [windows-latest, ubuntu-24.04]
        python: ["3.12", "3.13"]   # numpy 2.5 (requirements.txt) needs 3.12+

    defaults:
      run:
        working-directory: new_annotator

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: new_annotator/requirements.txt

      # Qt needs a few system libraries on a bare Ubuntu runner, even headless
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python run_tests.py
